name: Build and Push to ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ values.awsRegion }}
  ECR_REPOSITORY_URI: ${{ values.ecrRepositoryUri }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
{% raw %}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
{% endraw %}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
{% raw %}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
{% endraw %}
        run: |
          docker build -t $ECR_REPOSITORY_URI:$IMAGE_TAG .
          docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
          echo "image=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update k8s manifest with new image tag
        env:
{% raw %}
          IMAGE: ${{ steps.build-image.outputs.image }}
{% endraw %}
        run: |
          sed -i "s|image:.*|image: ${IMAGE}|" k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
{% raw %}
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ github.sha }}"
{% endraw %}
          git push